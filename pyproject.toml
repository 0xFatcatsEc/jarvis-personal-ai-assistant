[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stylus-jarvis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "PySide6>=6.8,<7",
    "qasync>=0.28,<1",
    "pypdf>=7.1.1",
]

[project.gui-scripts]
stylus-jarvis = "stylus_jarvis.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stylus_jarvis = ["release-manifest.toml", "storage/migrations/*.sql", "runtime/offline-policy.ps1"]

